name: Mirror & Script Health Check

on:
  schedule:
    # Runs automatically every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Principle of Least Privilege: strictly read-only access for public repository safety
permissions:
  contents: read

jobs:
  health-check:
    name: Validate Script & Mirrors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Shell Script Syntax
        run: |
          echo "Checking bash syntax for index.html..."
          bash -n index.html
          echo "Syntax check passed!"

      - name: Check Official Distro Mirrors & ISO Reachability
        run: |
          echo "### 🌐 Official Distro Mirrors & Script Health" >> $GITHUB_STEP_SUMMARY
          echo "| Distribution / Variety | Scraped Version | Resolved ISO URL | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY

          test_endpoint() {
              local distro="$1"
              local version="$2"
              local url="$3"

              echo "Checking $distro ($version): $url"
              local http_code
              http_code=$(curl -sI -L --max-time 15 -o /dev/null -w "%{http_code}" "$url" || echo "FAIL")

              if [[ "$http_code" =~ ^(200|301|302)$ ]]; then
                  echo "| **$distro** | \`$version\` | [Direct ISO Link]($url) | 🟢 OK (\`$http_code\`) |" >> $GITHUB_STEP_SUMMARY
                  return 0
              else
                  echo "| **$distro** | \`$version\` | [Direct ISO Link]($url) | 🔴 FAILED (\`$http_code\`) |" >> $GITHUB_STEP_SUMMARY
                  return 1
              fi
          }

          ERRORS=0

          # 1. Linux Mint XFCE
          MINT_VER=$(curl -sL --max-time 10 https://mirrors.kernel.org/linuxmint/stable/ | grep -o 'href="[0-9][^"]*"' | tr -d 'href="' | tr -d '/' | sort -V -r | head -n 1)
          test_endpoint "Linux Mint XFCE" "$MINT_VER" "https://mirrors.kernel.org/linuxmint/stable/$MINT_VER/linuxmint-$MINT_VER-xfce-64bit.iso" || ERRORS=$((ERRORS + 1))

          # 2. Linux Mint Cinnamon
          test_endpoint "Linux Mint Cinnamon" "$MINT_VER" "https://mirrors.kernel.org/linuxmint/stable/$MINT_VER/linuxmint-$MINT_VER-cinnamon-64bit.iso" || ERRORS=$((ERRORS + 1))

          # 3. Ubuntu Desktop
          UB_VER=$(curl -sL --max-time 10 https://releases.ubuntu.com/ | grep -o 'href="[0-9][^"]*"' | tr -d 'href="' | tr -d '/' | grep -E '^[0-9]{2}\.[0-9]{2}$' | sort -V -r | head -n 1)
          UB_ISO=$(curl -sL --max-time 10 "https://releases.ubuntu.com/$UB_VER/" | grep -o "ubuntu-[0-9.]*-desktop-amd64.iso" | sort -V | tail -n 1)
          test_endpoint "Ubuntu Desktop" "$UB_VER" "https://releases.ubuntu.com/$UB_VER/$UB_ISO" || ERRORS=$((ERRORS + 1))

          # 4. Xubuntu Desktop
          XUB_VER="24.04"
          XUB_ISO=$(curl -sL --max-time 10 "https://cdimage.ubuntu.com/xubuntu/releases/$XUB_VER/release/" | grep -o "xubuntu-[0-9.]*-desktop-amd64.iso" | head -n 1)
          test_endpoint "Xubuntu Desktop" "$XUB_VER" "https://cdimage.ubuntu.com/xubuntu/releases/$XUB_VER/release/$XUB_ISO" || ERRORS=$((ERRORS + 1))

          # 5. Debian Live XFCE (Current)
          DEB_VER=$(curl -sL --max-time 10 https://cdimage.debian.org/debian-cd/current-live/amd64/iso-hybrid/ | grep -o 'debian-live-[0-9.]*-amd64' | head -n 1 | sed 's/debian-live-//;s/-amd64//')
          test_endpoint "Debian Live XFCE" "$DEB_VER" "https://cdimage.debian.org/debian-cd/current-live/amd64/iso-hybrid/debian-live-$DEB_VER-amd64-xfce.iso" || ERRORS=$((ERRORS + 1))

          # 6. Arch Linux Latest
          test_endpoint "Arch Linux" "Latest" "https://geo.mirror.pkgbuild.com/iso/latest/archlinux-x86_64.iso" || ERRORS=$((ERRORS + 1))

          # 7. Parrot OS Security Edition
          PARROT_VER=$(curl -sL --max-time 10 https://deb.parrot.sh/parrot/iso/ | grep -o 'href="[0-9][^"]*"' | tr -d 'href="' | tr -d '/' | sort -V -r | head -n 1)
          test_endpoint "Parrot OS Security" "$PARROT_VER" "https://deb.parrot.sh/parrot/iso/$PARROT_VER/Parrot-security-${PARROT_VER}_amd64.iso" || ERRORS=$((ERRORS + 1))

          # 8. Parrot OS Home Edition
          test_endpoint "Parrot OS Home" "$PARROT_VER" "https://deb.parrot.sh/parrot/iso/$PARROT_VER/Parrot-home-${PARROT_VER}_amd64.iso" || ERRORS=$((ERRORS + 1))

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*Last Verified: $(date -u '+%Y-%m-%d %H:%M:%S UTC')*" >> $GITHUB_STEP_SUMMARY

          if [ $ERRORS -gt 0 ]; then
              echo "Health check encountered $ERRORS failed mirror(s)."
              exit 1
          fi
          echo "All mirrors and resolved ISO endpoints are healthy!"
